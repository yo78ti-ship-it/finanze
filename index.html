<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Mie Finanze</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanze">
<style>
:root{color-scheme:light dark;--bg:#f2f3f7;--card:#fff;--ink:#111318;--mut:#6b7280;--line:#e6e8ee;--acc:#4f46e5;--acc2:#7c3aed;--in:#16a34a;--out:#e11d48;--track:#eceef3;--chip:#eceef4;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0c10;--card:#16181e;--ink:#f1f2f4;--mut:#9aa0ab;--line:#262932;--acc:#8b85ff;--acc2:#a78bfa;--in:#34d399;--out:#fb7185;--track:#23262e;--chip:#20232b;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;width:100%;outline:none;min-width:0}
input:focus{border-color:var(--acc)}
.scr{display:none;max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(110px + env(safe-area-inset-bottom))}
.scr.on{display:block}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:6px 0 16px}
.top small{color:var(--mut);font-size:13px}
.top .icons{display:flex;gap:8px}
h1{font-size:26px;margin:2px 0 0;letter-spacing:-.02em}
h2{font-size:20px;margin:0}
h3{font-size:16px;margin:0}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:18px;flex:none}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.hero{background:var(--acc);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(79,70,229,.25)}
.hero small{opacity:.88;font-size:14px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.hero .hr{display:flex;gap:10px}
.hero .hr div{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.hero .hr small{font-size:12px}
.hero .hr b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.hero .pos,.hero .neg{color:#fff}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mini .card{margin:0;padding:12px}
.mini small,.stats small{color:var(--mut);font-size:12px;display:block}
.mini b,.stats b{font-size:15px;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.pos{color:var(--in)}.neg{color:var(--out)}.mut{color:var(--mut)}
.sect{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.link{color:var(--acc);font-weight:600;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fcard{background:var(--card);border-radius:18px;padding:14px 14px 14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:1px;position:relative;overflow:hidden;min-width:0}
.fcard::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.fcard b.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fe{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--c) 18%,transparent);margin-bottom:6px;flex:none}
.fcard small{color:var(--mut);font-size:12px}
.fcard .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.fcard.add{align-items:center;justify-content:center;color:var(--acc);font-weight:700;border:2px dashed var(--line);box-shadow:none;background:none;min-height:120px}
.fcard.add::before{display:none}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--chip)}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt small{color:var(--mut);font-size:12px}
.row>.money{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:16px 2px 2px;font-weight:600}
.card>.dayh:first-child{margin-top:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar,.fchips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-size:14px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.pnav button{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:22px;text-align:center;line-height:36px}
.pnav button:disabled{opacity:.3}
.pnav b{font-size:16px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut);text-align:center;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.big button{padding:12px 6px;font-size:14px}
.seg button.on.tin{color:var(--in)}.seg button.on.tout{color:var(--out)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{width:180px;height:180px;flex:none}
.donut .t1{font-size:15px;font-weight:800;fill:var(--ink)}.donut .t2{font-size:11px;fill:var(--mut)}
.legend{flex:1;min-width:210px}
.lg{display:flex;gap:8px;align-items:center;width:100%;padding:7px 0;border-bottom:1px solid var(--line)}
.lg:last-child{border:0}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg em{font-style:normal;color:var(--mut);font-size:12px;width:52px;text-align:right}
.lg b{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.bars{width:100%;height:auto;display:block}.bars text{fill:var(--mut);font-size:9px}
.leg{display:flex;gap:12px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stats .card{margin:0;padding:12px}
.goal{margin-top:4px}.goal+.goal{margin-top:14px}
.gl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
.pb{height:10px;border-radius:99px;background:var(--track);overflow:hidden}.pb i{display:block;height:100%;border-radius:99px}
.goal small{color:var(--mut);font-size:12px;display:block;margin-top:4px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tb{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mut);padding:4px 0}
.tab span{font-size:21px;filter:grayscale(1);opacity:.6}
.tab.on{color:var(--acc);font-weight:600}.tab.on span{filter:none;opacity:1}
.fab{width:60px;height:60px;border-radius:50%;margin:-28px auto 0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:34px;line-height:58px;text-align:center;box-shadow:0 8px 22px rgba(79,70,229,.45)}
.fab2{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:31;padding:16px 22px;border-radius:999px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;box-shadow:0 8px 22px rgba(79,70,229,.45)}
.layer{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;visibility:hidden}
.layer.open{transform:none;visibility:visible}
.layer .scr{display:block}
#sw{position:fixed;inset:0;z-index:40;pointer-events:none}
#sw .bd{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease}
#sw.open{pointer-events:auto}#sw.open .bd{opacity:1}#sw.open #sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{width:34px;height:34px;border-radius:50%;background:var(--chip);text-align:center;font-size:14px;flex:none}
.amt{display:flex;align-items:center;gap:4px;margin:18px 0 6px;justify-content:center}
.amt span{font-size:30px;font-weight:700;color:var(--mut)}
.amt input{font-size:44px;font-weight:800;text-align:center;background:none;border:0;max-width:260px;padding:0;letter-spacing:-.02em}
.amt.tin input{color:var(--in)}.amt.tout input{color:var(--out)}
.lbl{display:block;font-size:13px;color:var(--mut);margin:16px 2px 8px;font-weight:600}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.fchip{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--chip);white-space:nowrap;font-size:14px;border:2px solid transparent;font-weight:500}
.fchip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog{display:flex;align-items:center;gap:10px;margin:16px 2px 4px;font-size:15px}.tog input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;text-align:center;margin-top:12px}
.btn.main{background:var(--acc);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.btn.sec{background:var(--chip)}
.btn.danger{color:var(--out);background:var(--chip)}
.emos{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emos button{font-size:22px;padding:6px 0;border-radius:10px;text-align:center}.emos button.on{background:var(--chip);outline:2px solid var(--acc)}
.cols{display:flex;gap:10px;flex-wrap:wrap}.cols button{width:32px;height:32px;border-radius:50%}.cols button.on{outline:3px solid var(--ink);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.priv .money{filter:blur(7px)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.empty div{font-size:40px;margin-bottom:6px}
.warn{display:block;width:100%;background:var(--chip);background:color-mix(in srgb,var(--out) 12%,var(--card));color:var(--out);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.tbl td{padding:9px 2px;border-bottom:1px solid var(--line)}.tbl tr:last-child td{border:0}.tbl td.n{text-align:right;white-space:nowrap}
.hint{color:var(--mut);font-size:13px;margin:6px 2px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hero{position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero::before{width:220px;height:220px;right:-70px;top:-90px}
.hero::after{width:160px;height:160px;left:-50px;bottom:-90px;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.hbar{height:9px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin:0 0 10px}
.hbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s ease}
.hl{display:flex;justify-content:space-between;gap:10px;font-size:14px}.hl b{font-weight:800}
.hs{display:block;margin-top:10px;font-size:13px!important;opacity:.92}
.qa{padding:10px}
.qrow{display:flex;gap:8px}
.qrow input{flex:1}
.qgo{width:50px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:18px;text-align:center}
.qprev{display:flex;flex-wrap:wrap;gap:6px;padding:10px 2px 2px}
.qprev:empty{display:none}
.pill{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;background:var(--chip);font-weight:600;font-size:13px}
.ehint{color:var(--acc);font-size:13px;font-weight:600;margin:8px 2px 0;min-height:0}
.ehint:empty{display:none}
.ins{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.ins:last-child{border:0;padding-bottom:0}
.ins>span{font-size:20px;flex:none;width:28px;text-align:center}
.rr{display:flex;flex-direction:column;align-items:flex-end;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.rr small{color:var(--mut);font-size:11px;font-weight:500;margin-top:1px}
#toast.act{pointer-events:auto}
#undo{color:var(--acc2);font-weight:800;margin-left:12px;padding:2px 4px}
.anim>*{animation:up .35s ease both}
.anim>*:nth-child(2){animation-delay:.03s}.anim>*:nth-child(3){animation-delay:.06s}.anim>*:nth-child(4){animation-delay:.09s}.anim>*:nth-child(5){animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.donut circle+circle{animation:dn .8s ease both}
@keyframes dn{from{stroke-dasharray:0 1000}}
.fcard,.row,.chip,.btn,.fab,.qgo,.ib{transition:transform .12s ease}
.fcard:active,.row:active,.chip:active,.btn:active,.fab:active,.qgo:active,.ib:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.hero .big{font-size:34px}.mini b{font-size:13px}}
</style>
</head>
<body>
<main id="scr-home" class="scr on"></main>
<main id="scr-list" class="scr"></main>
<main id="scr-stats" class="scr"></main>
<main id="scr-folders" class="scr"></main>

<div id="fv" class="layer"><main class="scr"></main></div>
<div id="sw"><div class="bd" data-close></div><div id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="bFile" accept=".json,application/json" hidden>

<nav class="tabbar"><div class="tb">
  <button class="tab on" data-tab="home"><span>🏠</span>Home</button>
  <button class="tab" data-tab="list"><span>📋</span>Movimenti</button>
  <button class="fab" data-act="add" aria-label="Aggiungi">+</button>
  <button class="tab" data-tab="stats"><span>📊</span>Statistiche</button>
  <button class="tab" data-tab="folders"><span>📁</span>Cartelle</button>
</div></nav>

<script>
const KEY='cassa_v2',OLD='finanze_v1';
const MESI=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const MESIL=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GG=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const GGL=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const PAL=['#22c55e','#3b82f6','#f59e0b','#ef4444','#a855f7','#ec4899','#14b8a6','#f97316','#64748b','#84cc16','#06b6d4','#eab308'];
const EMO=['💼','💰','💵','🏦','📈','💳','🏠','🛒','🚗','⛽','🍔','☕','🍷','🎉','🎮','✈️','👕','💊','🏋️','💇','📱','💻','💡','🧾','🎁','🐶','👶','📚','🔧','🛠️','🎰','📦'];
const DEF=()=>({v:2,folders:[
  {id:'f1',name:'Lavoro',emoji:'💼',color:PAL[0],goal:0,budget:0},
  {id:'f2',name:'Casa',emoji:'🏠',color:PAL[1],goal:0,budget:0},
  {id:'f3',name:'Spesa',emoji:'🛒',color:PAL[2],goal:0,budget:0},
  {id:'f4',name:'Auto',emoji:'🚗',color:PAL[3],goal:0,budget:0},
  {id:'f5',name:'Svago',emoji:'🎉',color:PAL[4],goal:0,budget:0},
  {id:'f6',name:'Investimenti',emoji:'📈',color:PAL[6],goal:0,budget:0}],
  entries:[],recurring:[],settings:{name:'',start:0},lastBackup:null});

let S=null,SERVER=false,saving=Promise.resolve(),saveErr=false;
let tab='home',fv=null,SH={},lastFolder=null,lastType='in',LQ='',LT='',LF='';
const P={folder:{k:'day',o:0},stats:{k:'month',o:0},list:{k:'month',o:0}};
const DT={home:'out',stats:'out',folder:null};
const layers=[];

/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const FMT=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',useGrouping:'always'});
const eur=c=>FMT.format((c||0)/100);
const sgn=c=>(c>0?'+':c<0?'−':'')+FMT.format(Math.abs(c||0)/100);
const m=c=>`<span class="money">${eur(c)}</span>`;
const ms=c=>`<span class="money ${c>0?'pos':c<0?'neg':''}">${sgn(c)}</span>`;
const pct=x=>isFinite(x)?(x*100).toLocaleString('it-IT',{maximumFractionDigits:1})+'%':'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pnum(s){s=String(s??'').trim().replace(/[\s€]/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=Number(s);return isFinite(n)?n:null}
// Tutti gli importi sono in centesimi interi: nessun errore di arrotondamento
const cents=s=>{const n=pnum(s);return n===null?null:Math.round(n*100)};
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const[y,mo,d]=s.split('-').map(Number);return new Date(y,mo-1,d)};
const today=()=>ds(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const folder=id=>S.folders.find(f=>f.id===id)||{id,name:'Senza cartella',emoji:'📁',color:'#94a3b8',goal:0,budget:0};
const tint=c=>`background:${c}2e;background:color-mix(in srgb,${c} 18%,transparent)`;
function dayLabel(s){
  const t=new Date();t.setHours(0,0,0,0);const d=parseD(s),diff=Math.round((t-d)/864e5);
  if(diff===0)return 'Oggi';if(diff===1)return 'Ieri';
  return GGL[d.getDay()]+' '+d.getDate()+' '+MESIL[d.getMonth()].toLowerCase()+(d.getFullYear()!==t.getFullYear()?' '+d.getFullYear():'');
}
function range(k,o=0){
  const t=new Date();t.setHours(0,0,0,0);let a=null,b=null,label='Sempre';
  if(k==='day'){a=new Date(t);a.setDate(a.getDate()+o);b=a;label=o===0?'Oggi':o===-1?'Ieri':dayLabel(ds(a))}

  else if(k==='month'){a=new Date(t.getFullYear(),t.getMonth()+o,1);b=new Date(a.getFullYear(),a.getMonth()+1,0);label=MESIL[a.getMonth()]+' '+a.getFullYear()}

const sel=(r,fid)=>S.entries.filter(e=>e.date>=r.from&&e.date<=r.to&&(!fid||e.folderId===fid));

/* ---------- intelligenza: capisce cartella e tipo da quello che scrivi ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const DICT=[
  [/sigarett|tabacc|svapo|iqos|terea|gratta|scommess|lotto|slot|cinema|netflix|spotify|disney|playstation|xbox|discoteca|\bpub\b|birr|aperitiv|spritz|concerto/,'svago','out'],
  [/ristorant|pizz|pranzo|cena|colazion|mcdonald|burger|kebab|sushi|\bbar\b|caffe|cornett|panino|gelato|cocktail/,'svago','out'],
  [/spesa|supermercat|conad|coop|esselunga|lidl|eurospin|carrefour|penny|aldi|\bpane\b|latte|frutta|verdura|macelleria|detersiv/,'spesa','out'],
  [/benzina|diesel|gasolio|carburant|\bpieno\b|autostrad|pedaggio|parchegg|meccanic|tagliando|gomme|\bbollo\b|assicurazion|lavaggio|multa|treno|\bbus\b|metro|taxi|uber/,'auto','out'],
  [/affitto|mutuo|bollett|\bluce\b|enel|\bgas\b|acqua|internet|fibra|telefon|condominio|\btari\b|\brata\b/,'casa','out'],
  [/stipendio|\bpaga\b|salario|client|lavoro|fattura|incass|mancia|mance|provvigion|bonus|guadagn|commission|straordinar|giornata/,'lavoro','in'],
  [/dividend|cedola|interess/,'investimenti','in'],
  [/azion|\betf\b|crypto|bitcoin|\bbtc\b|investiment|trading|broker|\bpac\b/,'investimenti','out']];
const IN_WORDS=/guadagn|incass|ricevut|\bpres[oi]\b|entrat|vint|vincita|rimbors/;
const folderByKey=k=>S.folders.find(f=>norm(f.name)===k)||S.folders.find(f=>norm(f.name).includes(k));
function usualType(fid){
  let i=0,o=0;S.entries.forEach(e=>{if(e.folderId===fid)e.type==='in'?i++:o++});
  return i>o?'in':o>i?'out':/lavor|stipend|client|incass|entrat|guadagn/.test(norm(folder(fid).name))?'in':'out';
}
function guess(text){
  const t=norm(text);if(!t)return{};
  // 1) l'hai già scritto in passato: stessa cartella, tipo e importo dell'ultima volta
  const hist=[...S.entries].sort((a,b)=>(b.ts||0)-(a.ts||0)),w=t.split(' ')[0];
  const h=hist.find(e=>norm(e.note)===t)||(w.length>=3?hist.find(e=>norm(e.note).split(' ')[0]===w):null);
  if(h&&S.folders.some(f=>f.id===h.folderId))return{folderId:h.folderId,type:h.type,amount:h.amount,src:'history'};
  // 2) hai scritto il nome di una cartella; 3) parole conosciute (sigarette, benzina, affitto…)
  const r={},byName=S.folders.find(f=>norm(f.name).length>=3&&t.includes(norm(f.name)));
  if(byName)r.folderId=byName.id;
  for(const[re,key,type]of DICT)if(re.test(t)){const f=folderByKey(key);if(f&&!r.folderId)r.folderId=f.id;r.type=type;break}
  if(IN_WORDS.test(t))r.type='in';
  if(r.folderId&&!r.type)r.type=usualType(r.folderId);
  return r;
}
// "sigarette 5,50" → uscita di 5,50 € in Svago; "+50 lavoro" → entrata di 50 € in Lavoro
function parseQuick(text){
  let s=String(text||'').trim(),type=null;if(!s)return null;
  if(/^\+/.test(s)){type='in';s=s.slice(1)}else if(/^[-−]/.test(s)){type='out';s=s.slice(1)}
  const mm=s.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(?:€|euro\b)?/i);
  const amount=mm?cents(mm[1]):null;
  const note=(mm?s.replace(mm[0],' '):s).replace(/€|\beuro\b/gi,' ').replace(/\s+/g,' ').trim();
  const g=guess(note);
  return{amount,note:note?note[0].toUpperCase()+note.slice(1):'',type:type||g.type||null,folderId:g.folderId||null};
}
function qaPreview(){
  const el=$('#qaPrev'),p=parseQuick($('#qa').value);

function addEntry(e,rec){

}
function insights(){
  const out=[],now=new Date(),dm=now.getDate(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const mo=sel(range('month')),s=sum(mo),prev=sel(range('month',-1)),d=sum(sel(range('day')));
  S.folders.forEach(f=>{const x=sum(mo.filter(e=>e.folderId===f.id));
    if(f.budget&&x.out>f.budget)out.push(['🚨',`${f.emoji} <b>${esc(f.name)}</b>: hai superato il limite del mese di <b>${m(x.out-f.budget)}</b>.`]);
    else if(f.budget&&x.out>=f.budget*.8)out.push(['⚠️',`${f.emoji} <b>${esc(f.name)}</b>: hai già usato il ${pct(x.out/f.budget)} del limite del mese.`])});
  if(d.in&&d.out)out.push(['🧮',`Oggi hai speso il <b>${pct(d.out/d.in)}</b> di quello che hai guadagnato.`]);
  if(mo.length>=3&&dm>=3&&dm<dim){const proj=Math.round(s.net/dm*dim);out.push(['🔮',`A questo ritmo, a fine ${MESIL[now.getMonth()].toLowerCase()} ${proj>=0?'metterai da parte circa':'sarai sotto di circa'} <b>${m(Math.abs(proj))}</b>.`])}
  const cnt={};mo.filter(e=>e.type==='out'&&e.note).forEach(e=>{const k=norm(e.note),c=cnt[k]||(cnt[k]={n:0,v:0,label:e.note});c.n++;c.v+=e.amount});
  const rep=Object.values(cnt).filter(x=>x.n>=3).sort((a,b)=>b.v-a.v)[0];
  if(rep)out.push(['🔁',`<b>${esc(rep.label)}</b>: ${rep.n} volte questo mese (${m(rep.v)}). In un anno sarebbero circa <b>${m(Math.round(rep.v/dm*365))}</b>.`]);
  const top=byFolder(mo,'out')[0];
  if(top){const pv=sum(prev.filter(e=>e.folderId===top.id)).out;out.push(['💸',`Questo mese spendi di più in <b>${top.emoji} ${esc(top.name)}</b>: ${m(top.v)}${pv?`, il mese scorso in tutto ${m(pv)}`:''}.`])}
  S.folders.forEach(f=>{if(!f.goal)return;const x=sum(mo.filter(e=>e.folderId===f.id));out.push(x.in>=f.goal?['🏆',`${f.emoji} <b>${esc(f.name)}</b>: obiettivo del mese raggiunto!`]:['🎯',`${f.emoji} <b>${esc(f.name)}</b>: ti mancano <b>${m(f.goal-x.in)}</b> per l'obiettivo del mese.`])});
  return out.slice(0,5);
}

function migrate(o){

  (o.categories||[]).forEach(c=>{

  (o.tx||[]).forEach(t=>{if(t.type!=='in'&&t.type!=='out')return;n.entries.push({id:t.id||uid(),type:t.type,amount:t.amount,folderId:map[t.categoryId]||n.folders[0].id,note:t.note||'',date:t.date,time:'',ts:t.ts||0})});

// Crea in automatico i movimenti che si ripetono ogni mese (es. affitto, stipendio)
function processRecurring(){
  const now=new Date(),cur=now.getFullYear()*12+now.getMonth();
  for(const r of S.recurring){
    const[y,mo]=r.last.split('-').map(Number);
    for(let k=y*12+mo,i=0;k<=cur&&i<120;k++,i++){
      if(k===cur&&now.getDate()<r.day)break;
      const Y=Math.floor(k/12),M=k%12+1;
      S.entries.push({id:uid(),type:r.type,amount:r.amount,folderId:r.folderId,note:r.note,date:`${Y}-${pad(M)}-${pad(r.day)}`,time:'',ts:Date.now(),rec:r.id});
      r.last=`${Y}-${pad(M)}`;
    }
  }
}

  if(tot>0)items.forEach(it=>{
    const len=C*it.v/tot,dash=items.length===1?C:len>4?len-2:len;
    s+=`<circle cx="90" cy="90" r="${R}" fill="none" stroke="${it.color}" stroke-width="22" stroke-dasharray="${dash} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(it.name)}: ${eur(it.v)}</title></circle>`;off+=len;
  });
  return s+`<text x="90" y="92" text-anchor="middle" class="t1 money">${eur(tot)}</text><text x="90" y="110" text-anchor="middle" class="t2">${sub}</text></svg>`;

  :empty(type==='in'?'Nessuna entrata in questo periodo':'Nessuna uscita in questo periodo','🥧')}</div>`;

function buckets(r){

  if(r.k==='day')for(let i=6;i>=0;i--){const d=new Date(r.a);d.setDate(d.getDate()-i);out.push(day(d,GG[d.getDay()]))}
  else if(r.k==='week')for(let i=0;i<7;i++){const d=new Date(r.a);d.setDate(d.getDate()+i);out.push(day(d,GG[d.getDay()]))}
  else if(r.k==='month')for(let i=1;i<=r.b.getDate();i++)out.push(day(new Date(r.a.getFullYear(),r.a.getMonth(),i),String(i)));
  else{

  const goal=Math.max(0,cents($('#fGoal').value)||0),budget=Math.max(0,cents($('#fBud').value)||0);
  let f=SH.id?S.folders.find(x=>x.id===SH.id):null;
  if(f)Object.assign(f,{name,emoji:SH.emoji,color:SH.color,goal,budget});
  else{f={id:uid(),name,emoji:SH.emoji,color:SH.color,goal,budget};S.folders.push(f);lastFolder=f.id}
  commit();back();toast(SH.id?'✓ Cartella aggiornata':'📁 Cartella creata');
}
function deleteFolder(){
  const f=S.folders.find(x=>x.id===SH.id),n=S.entries.filter(e=>e.folderId===f.id).length;
  if(!confirm(`Eliminare la cartella "${f.name}"${n?' e i suoi '+n+' movimenti':''}? Non si può annullare.`))return;
  S.folders=S.folders.filter(x=>x.id!==f.id);S.entries=S.entries.filter(e=>e.folderId!==f.id);S.recurring=S.recurring.filter(r=>r.folderId!==f.id);
  save();history.go(-layers.length);setTimeout(render,60);toast('Cartella eliminata');
}
function settingsSheet(){
  SH={kind:'settings'};const d=backupDays();
  openSheet(`<div class="sh-h"><h2>Impostazioni</h2><button class="x" data-close aria-label="Chiudi">✕</button></div>
  <label class="lbl">Il tuo nome</label><input id="sName" value="${esc(S.settings.name)}" placeholder="Es. Mario" autocomplete="off">
  <label class="lbl">Soldi che avevi all'inizio (facoltativo)</label><input id="sStart" inputmode="decimal" value="${S.settings.start?(S.settings.start/100).toFixed(2).replace('.',','):''}" placeholder="0,00">
  <p class="hint">Serve per il saldo totale: soldi iniziali + entrate − uscite.</p>
  <button class="btn main" id="sSave">Salva</button>
  <label class="lbl" style="margin-top:24px">🔁 Movimenti automatici ogni mese</label>
  <div class="card" style="padding:6px 12px;box-shadow:none;background:var(--chip)">${S.recurring.length?S.recurring.map(r=>{const f=folder(r.folderId);return `<div class="row"><span class="ico">${f.emoji}</span><span class="rt"><b>${esc(r.note||f.name)}</b><small>Ogni mese, il giorno ${r.day}</small></span>${ms(r.type==='in'?r.amount:-r.amount)}<button class="x" data-delrec="${r.id}" aria-label="Elimina">✕</button></div>`}).join(''):'<p class="hint">Nessuno. Quando aggiungi un movimento spunta "Ripeti ogni mese".</p>'}</div>
  <label class="lbl" style="margin-top:24px">💾 Backup</label>
  <p class="hint">${SERVER?'Sul Mac ogni modifica si salva da sola nel file "dati/finanze.json", con una copia ogni giorno in "dati/backup".':'I dati sono salvati su questo dispositivo. Esporta un backup ogni settimana e tienilo in File / Google Drive: serve se cambi o perdi il telefono.'} ${d===null?'Nessun backup esportato finora.':'Ultimo backup: '+(d?d+(d===1?' giorno fa':' giorni fa'):'oggi')+'.'}</p>
  <button class="btn sec" id="bExp">⬆️ Esporta backup</button>
  <button class="btn sec" id="bImp">⬇️ Importa backup</button>
  <button class="btn sec" id="bCsv">📄 Esporta per Excel (CSV)</button>
  <button class="btn danger" id="bReset" style="margin-top:28px">Cancella tutti i dati</button>
  <p class="hint" style="text-align:center;margin-top:14px">Le Mie Finanze · versione 2</p>`);
}

/* ---------- eventi ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button,[data-folder],[data-close]');if(!t)return;const d=t.dataset;
  if('close' in d)return back();
  if(d.tab){if(layers.length)history.go(-layers.length);tab=d.tab;render();scrollTo(0,0);const sc=$('#scr-'+tab);sc.classList.remove('anim');void sc.offsetWidth;sc.classList.add('anim');return}
  if(d.act==='add')return entrySheet(null,fv?{folderId:fv}:{});
  if(d.act==='settings')return settingsSheet();
  if(d.act==='priv'){document.body.classList.toggle('priv');try{localStorage.setItem(KEY+'_priv',document.body.classList.contains('priv')?'1':'')}catch(e){}return rHome()}
  if(d.edit)return entrySheet(d.edit);
  if(d.folder)return openFolder(d.folder);
  if('newfolder' in d)return folderSheet(null);
  if(d.editfolder)return folderSheet(d.editfolder);
  if(d.per){P[d.per]={k:d.k,o:0};return render()}
  if(d.pnav){P[d.pnav].o=Math.min(0,P[d.pnav].o+ +d.d);return render()}
  if(d.dt){DT[d.dt]=d.v;return render()}
  if(d.lt!==undefined){LT=d.lt;return rList()}
  if(d.lf!==undefined){LF=d.lf;return rList()}
  if(d.t){SH.type=d.t;SH.manualType=true;return syncEntry()}
  if(d.fpick){SH.folderId=d.fpick;SH.manualFolder=true;return syncEntry()}
  if(t.id==='undo'){const u=toast.u;$('#toast').classList.remove('on','act');toast.u=null;return u?.()}
  if(t.id==='qaGo')return quickGo();
  if(d.emo){SH.emoji=d.emo;return syncFolder()}
  if(d.col){SH.color=d.col;return syncFolder()}
  if(d.delrec){if(confirm('Smettere di ripetere questo movimento? Quelli già inseriti restano.')){S.recurring=S.recurring.filter(r=>r.id!==d.delrec);save();settingsSheet()}return}
  switch(t.id){
    case 'eSave':return saveEntry();
    case 'eDel':if(confirm('Eliminare questo movimento?')){S.entries=S.entries.filter(x=>x.id!==SH.id);commit();back();toast('Movimento eliminato')}return;
    case 'fSave':return saveFolder();
    case 'fDel':return deleteFolder();
    case 'sSave':{S.settings.name=$('#sName').value.trim();S.settings.start=cents($('#sStart').value)||0;commit();back();return toast('✓ Salvato')}
    case 'bExp':{const prev=S.lastBackup;S.lastBackup=Date.now();if(await giveFile('finanze-backup-'+today()+'.json',JSON.stringify(S,null,2),'application/json')){save();render();toast('✓ Backup esportato')}else S.lastBackup=prev;return}
    case 'bImp':return $('#bFile').click();
    case 'bCsv':{
      const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',rows=['Data;Ora;Tipo;Cartella;Descrizione;Importo'];
      [...S.entries].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>rows.push([e.date,e.time||'',e.type==='in'?'Entrata':'Uscita',q(folder(e.folderId).name),q(e.note),((e.type==='in'?1:-1)*e.amount/100).toFixed(2).replace('.',',')].join(';')));
      return giveFile('movimenti-'+today()+'.csv','﻿'+rows.join('\n'),'text/csv');
    }
    case 'bReset':if(confirm('Cancellare TUTTI i dati? Prima esporta un backup.')&&confirm('Sei proprio sicuro? Non si può annullare.')){S=DEF();commit();back();toast('Dati cancellati')}return;
  }
});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='q'){LQ=e.target.value;rListRes()}else if(id==='qa')qaPreview();else if(id==='eNote')smartNote()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qa'){e.preventDefault();return quickGo()}if(e.key==='Enter'&&SH.kind==='entry'&&$('#sw').classList.contains('open')&&e.target.tagName==='INPUT'){e.preventDefault();saveEntry()}});
$('#bFile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.v)throw 0;
  const n=d.v>=2?fix(d):migrate(d);if(confirm(`Sostituire i dati attuali con il backup (${n.entries.length} movimenti)?`)){S=n;commit();back();toast('✓ Backup importato')}}catch(x){alert('Questo file non è un backup valido.')}e.target.value=''})};

// Sul telefono apre il menu Condividi (es. "Salva su File"), sul computer scarica il file
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function giveFile(name,text,type){
  const file=new File([text],name,{type});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});return true}catch(e){if(e.name==='AbortError')return false}}
  download(name,text,type);return true;
}

async function init(){
  let local=null,old=null;
  try{local=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  try{old=JSON.parse(localStorage.getItem(OLD))}catch(e){}
  try{const r=await fetch('api/data',{cache:'no-store'});if(r.ok){const d=await r.json();SERVER=true;if(d&&d.v)S=d.v>=2?d:migrate(d)}}catch(e){}
  if(!S)S=local&&local.v>=2?local:old&&old.v&&old.tx?.length?migrate(old):DEF();
  fix(S);
  try{if(localStorage.getItem(KEY+'_priv'))document.body.classList.add('priv')}catch(e){}
  if(!SERVER){try{navigator.storage?.persist?.()}catch(e){}if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('sw.js').catch(()=>{})}
  history.replaceState({l:0},'');
  commit();
}
init();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S){processRecurring();render()}});
</script>
